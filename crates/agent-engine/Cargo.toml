[package]
name = "agent-engine"
description = "The native agent engine: the agent loop, its tools and the model providers' APIs, in process."
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
test-support = []

[dependencies]
brand.workspace = true
domain.workspace = true
private-file.workspace = true
subprocess.workspace = true
llm-providers.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize"] }
thiserror.workspace = true
tracing.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }
ignore = "0.4"
globset = "0.4"
regex = "1"
base64 = "0.23"
sha2 = "0.10"
jsonschema = { version = "0.33", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
uuid.workspace = true

[dev-dependencies]
agent-engine = { path = ".", features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
