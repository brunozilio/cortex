[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is unmaintained, not vulnerable; it comes only through syntect, which has no release without it" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant 4 is unmaintained, not vulnerable, merged into zbus 6; it comes only through keyring 3's pure-Rust Secret Service backend on Linux, whose zbus 4 has no release without it" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 3 is unmaintained, not vulnerable, merged into zbus 6; it comes only through keyring 3's pure-Rust Secret Service backend on Linux, whose zbus 4 has no release without it" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 4 is unmaintained, not vulnerable, merged into zbus 6; it comes only through keyring 3's pure-Rust Secret Service backend on Linux, whose zbus 4 has no release without it" },
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
