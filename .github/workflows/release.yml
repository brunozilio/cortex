name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build and attach the DMG to (v0.2.0)
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ${{ fromJSON(vars.SUPERFIK_CI_RUNNER || '["ubuntu-latest"]') }}
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  lockfile:
    needs: release-please
    if: needs.release-please.outputs.pr
    runs-on: ${{ fromJSON(vars.SUPERFIK_CI_RUNNER || '["ubuntu-latest"]') }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: runner.environment != 'self-hosted'
        with:
          toolchain: stable
      - run: cargo update --workspace
      - run: |
          git diff --quiet Cargo.lock && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update Cargo.lock"
          git push

  publish:
    needs: release-please
    environment: release
    if: always() && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ fromJSON(vars.SUPERFIK_CI_RUNNER || '["macos-latest"]') }}
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Use this runner's persistent build cache
        if: runner.environment == 'self-hosted'
        run: |
          mkdir -p "$RUNNER_TOOL_CACHE/superfik-target"
          test ! -e target
          ln -s "$RUNNER_TOOL_CACHE/superfik-target" target
      - name: Fetch pinned native engine
        if: vars.SUPERFIK_BROWSER_RELEASE_ENABLED == 'true'
        run: |
          engine_path="$(python3 scripts/fetch_engine.py --output "$RUNNER_TEMP/browser-engine")"
          echo "CEF_PATH=$engine_path" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: runner.environment != 'self-hosted'
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: runner.environment != 'self-hosted'
      - run: brew install cmake ninja
        if: runner.environment != 'self-hosted'
      - name: Signing keychain
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          SELF_HOSTED: ${{ runner.environment == 'self-hosted' }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASSWORD="$(uuidgen)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null
          if [[ "$SELF_HOSTED" == true ]]; then
            echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
            exit 0
          fi
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials superfik --keychain "$KEYCHAIN" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER"
          rm "$RUNNER_TEMP/AuthKey.p8"
      - name: Notarization key
        if: runner.environment == 'self-hosted'
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - run: scripts/bundle-macos.sh
        env:
          SUPERFIK_RELEASE: 1
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - run: |
          gh release upload "$TAG" "target/release/bundle/Superfik-${TAG#v}.dmg" \
            target/release/bundle/Superfik-"${TAG#v}"-macos-*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Announce the update
        env:
          SUPERFIK_UPDATE_KEY: ${{ secrets.SUPERFIK_UPDATE_KEY }}
          MINIMUM: ${{ vars.SUPERFIK_MINIMUM_VERSION }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          case "$(uname -m)" in arm64 | aarch64) ARCH=aarch64 ;; *) ARCH=x86_64 ;; esac
          .github/workflows/scripts/announce-update.sh "target/release/bundle/Superfik-$VERSION-macos-$ARCH.zip" "macos-$ARCH"
      - name: Remove keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
      - name: Remove notarization key
        if: always() && runner.environment == 'self-hosted'
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  publish-linux:
    needs: release-please
    environment: release
    if: always() && vars.SUPERFIK_LINUX_RELEASE_ENABLED == 'true' && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
      SUPERFIK_RELEASE: '1'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev libdbus-1-dev libudev-dev libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libatspi2.0-0t64 libcups2t64 libgbm1 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2
      - run: scripts/bundle-linux.sh
      - name: Install and exercise both Linux packages on clean Ubuntu
        run: |
          docker build --target runtime -f deploy/linux/Dockerfile.qa -t superfik-package-check .
          mkdir -p target/linux-package-checks
          docker run --rm \
            -e VERSION="${TAG#v}" -e XDG_RUNTIME_DIR=/tmp/runtime \
            -v "$PWD/target/release/bundle:/packages:ro" \
            -v "$PWD/.github/workflows/scripts:/checks:ro" \
            -v "$PWD/target/linux-package-checks:/evidence" \
            superfik-package-check bash -euc '
              mkdir -m700 -p "$XDG_RUNTIME_DIR"
              dpkg -i "/packages/superfik_${VERSION}_amd64.deb"
              /usr/bin/superfik --snapshot /evidence/installed.png --size 1440x900 --scale 1
              bash /checks/check-linux-package.sh "/packages/superfik_${VERSION}_amd64.deb" "/packages/Superfik-${VERSION}-linux-amd64.tar.gz" /evidence
              mkdir -p /root/.config/superfik
              touch /root/.config/superfik/uninstall-check
              dpkg -r superfik
              test -f /root/.config/superfik/uninstall-check
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: linux-package-acceptance
          path: target/linux-package-checks
          if-no-files-found: ignore
          retention-days: 7
      - run: |
          VERSION="${TAG#v}"
          gh release upload "$TAG" \
            "target/release/bundle/superfik_${VERSION}_amd64.deb" \
            "target/release/bundle/Superfik-${VERSION}-linux-amd64.tar.gz" \
            "target/release/bundle/Superfik-${VERSION}-linux-amd64.sha256" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Announce the update
        env:
          SUPERFIK_UPDATE_KEY: ${{ secrets.SUPERFIK_UPDATE_KEY }}
          MINIMUM: ${{ vars.SUPERFIK_MINIMUM_VERSION }}
          GH_TOKEN: ${{ github.token }}
        run: .github/workflows/scripts/announce-update.sh "target/release/bundle/Superfik-${TAG#v}-linux-amd64.tar.gz" linux-x86_64

  publish-windows:
    needs: release-please
    if: always() && vars.SUPERFIK_WINDOWS_RELEASE_ENABLED == 'true' && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - run: dotnet tool install --global wix --version 5.0.2
      - name: Fetch the pinned Windows engine
        if: hashFiles('scripts/cef-release.windows-x86_64.lock.json') != ''
        shell: pwsh
        run: |
          $engine = python scripts/fetch_engine.py --lock scripts/cef-release.windows-x86_64.lock.json --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Windows engine is not available." }
          "CEF_PATH=$engine" >> $env:GITHUB_ENV
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: python -m unittest discover -s scripts -p 'test_windows_*.py'
      - run: ./scripts/bundle-windows.ps1
      - name: Attach MSI and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:TAG -replace '^v', ''
          $msi = "target/x86_64-pc-windows-msvc/release/bundle/Superfik-$version-x64.msi"
          if (-not (Test-Path $msi)) { throw "MSI version does not match the release tag." }
          gh release upload $env:TAG $msi "$msi.sha256" --clobber
          if ($LASTEXITCODE -ne 0) { throw "MSI upload failed." }

  publish-server:
    needs: release-please
    environment: release
    if: always() && vars.SUPERFIK_LINUX_RELEASE_ENABLED == 'true' && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
      SUPERFIK_RELEASE: '1'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev libdbus-1-dev libudev-dev libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libatspi2.0-0t64 libcups2t64 libgbm1 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2
      - run: .github/workflows/scripts/bundle-server.sh
      - name: Sign the server archive
        env:
          SUPERFIK_UPDATE_KEY: ${{ secrets.SUPERFIK_UPDATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPERFIK_UPDATE_KEY:-}" ]]; then
            echo "::error::SUPERFIK_UPDATE_KEY is not set; install-server.sh refuses an unsigned server archive"
            exit 1
          fi
          ARCHIVE="target/release/bundle/superfik-server-${TAG#v}-linux-x86_64.tar.gz"
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$ARCHIVE")"
          ASSET="$(cargo run --quiet -p xtask -- sign-update "$ARCHIVE" --version "${TAG#v}" --platform linux-x86_64 --url "$URL")"
          ASSET="$ASSET" ARCHIVE="$ARCHIVE" python3 -I -c '
          import binascii, json, os
          asset, archive = json.loads(os.environ["ASSET"]), os.environ["ARCHIVE"]
          with open(archive + ".sha256", "w") as out:
              out.write("%s  %s\n" % (asset["sha256"], os.path.basename(archive)))
          with open(archive + ".sig", "wb") as out:
              out.write(binascii.unhexlify(asset["signature"]))'
          (cd "$(dirname "$ARCHIVE")" && sha256sum -c "$(basename "$ARCHIVE").sha256")
          scripts/install-server.sh --verify "$ARCHIVE"
      - run: |
          ARCHIVE="target/release/bundle/superfik-server-${TAG#v}-linux-x86_64.tar.gz"
          gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sig" "$ARCHIVE.sha256" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
