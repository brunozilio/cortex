[package]
name = "superfik-web"
description = "The Superfik web app (app.superfik.com): the shared client painted on a WebGPU canvas, talking to the server that served it."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
superfik-client.workspace = true
superfik-core.workspace = true
superfik-frames.workspace = true
superfik-protocol.workspace = true
superfik-render.workspace = true
superfik-ui.workspace = true
winit.workspace = true

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
superfik-remote.workspace = true
wgpu.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "KeyboardEvent", "Location", "Navigator", "Clipboard", "Performance", "Response", "RequestInit", "HtmlInputElement", "FileList", "File", "Blob", "HtmlTextAreaElement", "CompositionEvent", "InputEvent", "CssStyleDeclaration", "HtmlElement", "console"] }
js-sys = "0.3"

[lints]
workspace = true
