[graph]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained but stable; pulled in transitively" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained; pulled in by the font stack" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained; serde_yaml_ng reads skill and agent frontmatter with it" },
    { id = "RUSTSEC-2026-0459", reason = "SQLite 3.54 needs libsqlite3-sys 0.39, which diesel (via whatsapp-rust) does not accept yet; we only open databases we or the user's own browser wrote" },
]

[licenses]
allow = [
    "0BSD", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-1-Clause", "BSD-2-Clause", "BSD-3-Clause",
    "BSL-1.0", "CC0-1.0", "CDLA-Permissive-2.0", "ISC", "MIT", "MIT-0", "MPL-2.0", "NCSA", "Unicode-3.0",
    "Unlicense", "Zlib",
    "bzip2-1.0.6",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
