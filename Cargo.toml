[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.5.0"
edition = "2024"
publish = false
authors = ["Bruno Zilio"]
rust-version = "1.97"

[workspace.dependencies]
superfik-core = { path = "crates/superfik-core" }
superfik-protocol = { path = "crates/superfik-protocol" }
superfik-backend = { path = "crates/superfik-backend" }
superfik-process = { path = "crates/superfik-process" }
superfik-private-file = { path = "crates/superfik-private-file" }
superfik-mlx = { path = "crates/superfik-mlx" }
superfik-native = { path = "crates/superfik-native" }
superfik-providers = { path = "crates/superfik-providers" }
superfik-sdk = { path = "crates/superfik-sdk" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tempfile = "3"
crossbeam-channel = "0.5"

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
