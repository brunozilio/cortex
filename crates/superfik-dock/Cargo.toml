[package]
name = "superfik-dock"
description = "The Dock tile: an image seam, and the macOS application icon behind a trait."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSResponder",
    "NSImage",
    "NSImageRep",
    "NSBitmapImageRep",
    "NSGraphics",
] }

[lints]
workspace = true
