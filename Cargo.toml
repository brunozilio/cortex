[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
authors = ["brunozilio"]
rust-version = "1.97"

[workspace.dependencies]
brand = { path = "crates/brand" }
content = { path = "crates/content" }
script = { path = "crates/script" }
domain = { path = "crates/domain" }
protocol = { path = "crates/protocol" }
backend = { path = "crates/backend" }
platform = { path = "crates/platform" }
agent-engine = { path = "crates/agent-engine" }
llm-providers = { path = "crates/llm-providers" }
sdk = { path = "crates/sdk" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tempfile = "3"
crossbeam-channel = "0.5"

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
