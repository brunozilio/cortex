name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo run -q -p xtask -- lint
      - run: cargo test --workspace --locked

  linux:
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  musl:
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - run: python3 -m pip install --user --break-system-packages ziglang cargo-zigbuild
      - run: cargo zigbuild --locked -p cli --target x86_64-unknown-linux-musl
      - run: |
          command=$(sed -n 's/^command *= *"\(.*\)".*/\1/p' brand.toml)
          file "target/x86_64-unknown-linux-musl/debug/$command"
          "target/x86_64-unknown-linux-musl/debug/$command" --version

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  folders:
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Each provider, tool or feature folder can be removed; each provider can be kept alone
        run: |
          set -eu
          aside=$(mktemp -d)
          check() { cargo clippy --workspace --all-targets --locked -- -D warnings; }
          providers=crates/llm-providers/src/providers
          for name in $(ls "$providers"); do
            mv "$providers/$name" "$aside/"
            check
            mv "$aside/$name" "$providers/"
          done
          layers="crates/agent-engine/src/tools/builtin crates/backend/src/features crates/cli/src/tui/features"
          for name in $(for layer in $layers; do find "$layer" -mindepth 1 -maxdepth 1 -type d -exec basename {} \;; done | sort -u); do
            for layer in $layers; do
              if [ -d "$layer/$name" ]; then mkdir -p "$aside/$layer" && mv "$layer/$name" "$aside/$layer/"; fi
            done
            check
            for layer in $layers; do
              if [ -d "$aside/$layer/$name" ]; then mv "$aside/$layer/$name" "$layer/"; fi
            done
          done
          for keep in $(ls "$providers"); do
            for name in $(ls "$providers"); do
              [ "$name" = "$keep" ] || mv "$providers/$name" "$aside/"
            done
            cargo check --workspace --locked
            for name in $(ls "$aside"); do
              [ -d "$aside/$name/src" ] || mv "$aside/$name" "$providers/"
            done
          done
