<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Superfik</title>
    <style>
      :root { color-scheme: light dark; --bg: #f6f6f5; --text: #1c1c1c; --muted: #6b6b6b; }
      @media (prefers-color-scheme: dark) { :root { --bg: #222; --text: #ececec; --muted: #a0a0a0; } }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
        font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Inter", sans-serif; }
      canvas#superfik { display: block; width: 100vw; height: 100vh; }
      [hidden] { display: none !important; }
      #unsupported { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; }
      #unsupported p { margin: 6px 0 0; color: var(--muted); max-width: 420px; }
    </style>
  </head>
  <body>
    <canvas id="superfik"></canvas>
    <div id="unsupported" hidden>
      <div>
        <strong>This browser cannot show Superfik</strong>
        <p>Superfik draws with WebGPU. Open it in a recent Chrome, Edge or Safari, or use the desktop app.</p>
      </div>
    </div>
    <script type="module">
      // Without WebGPU there is nothing to draw with: say so instead of a blank page.
      if (!navigator.gpu) {
        document.getElementById("superfik").hidden = true;
        document.getElementById("unsupported").hidden = false;
      } else {
        const { default: init } = await import("./superfik_web.js");
        await init();
      }
    </script>
  </body>
</html>
