[package]
name = "superfik-backend"
description = "Superfik backend: executes client commands against the agent engine. In-process today; the same seam serves a remote server later."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
superfik-private-file.workspace = true
superfik-core.workspace = true
superfik-protocol.workspace = true
superfik-providers.workspace = true
crossbeam-channel.workspace = true
superfik-mlx.workspace = true
superfik-native.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tiny_http = "0.12"
base64 = "0.23"
sha2 = "0.10"
chacha20poly1305 = "0.10"
getrandom = "0.3"
serde.workspace = true
uuid.workspace = true
fastembed = { version = "7", optional = true }

[features]
default = ["embeddings"]
embeddings = ["dep:fastembed"]

[dev-dependencies]
superfik-native = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
ureq = "3"

[lints]
workspace = true
