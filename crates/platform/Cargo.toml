[package]
name = "platform"
description = "What differs between operating systems (processes, shells, private files, folders, notifications), one folder per system."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Threading"] }
