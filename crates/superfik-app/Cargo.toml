[package]
name = "superfik-app"
description = "Superfik desktop app: a GPU canvas for AI coding agents."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "superfik"
path = "src/main.rs"

[dependencies]
superfik-private-file.workspace = true
superfik-core.workspace = true
superfik-keychain.workspace = true
superfik-protocol.workspace = true
superfik-backend.workspace = true
superfik-server.workspace = true
superfik-remote.workspace = true
superfik-unlock.workspace = true
superfik-update.workspace = true
crossbeam-channel.workspace = true
ureq = { version = "3", features = ["json"] }
superfik-render.workspace = true
superfik-ui.workspace = true
superfik-client.workspace = true
superfik-sound.workspace = true
superfik-voice = { workspace = true, features = ["native"] }
superfik-haptics.workspace = true
superfik-dock.workspace = true
superfik-menu.workspace = true
superfik-i18n.workspace = true
superfik-browser.workspace = true
winit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
rfd = "0.17"
arboard = { version = "3", default-features = false }
image.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sys-locale = "0.3"
plist = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
smithay-clipboard = "0.7"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[dev-dependencies]
tempfile.workspace = true
superfik-engine.workspace = true

[build-dependencies]
embed-resource = "3"

[lints]
workspace = true
