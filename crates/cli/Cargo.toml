[package]
name = "cli"
description = "The terminal chat: talk to the agent in your project."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "cortex"
path = "src/main.rs"

[dependencies]
platform.workspace = true
content.workspace = true
brand.workspace = true
sdk.workspace = true
domain.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
ratatui = "0.30.2"
unicode-width = "0.2.3"
clap = { version = "4.6.7", features = ["derive"] }
tui-markdown = "0.3.13"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "plist-load", "regex-onig"] }
tachyonfx = { version = "0.25.2", default-features = false, features = ["std", "std-duration"] }

[dev-dependencies]
tempfile.workspace = true
backend.workspace = true
agent-engine = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
