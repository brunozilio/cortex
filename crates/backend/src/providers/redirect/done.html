<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}} · {{NAME}}</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--fg:#1c1d21;--muted:#5f6370;--line:#e3e5e9;--ok:#1a7f37;--ok-soft:#e6f4ea;--bad:#c62a2f;--bad-soft:#fdecec}
@media (prefers-color-scheme:dark){:root{--bg:#121316;--card:#1a1b1f;--fg:#ececef;--muted:#9a9ca6;--line:#2a2b31;--ok:#6fd38a;--ok-soft:#173222;--bad:#ff8a8a;--bad-soft:#3a1d20}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;display:grid;place-items:center;padding:16px;-webkit-font-smoothing:antialiased}
main{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px 28px 26px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05)}
.mark{width:48px;height:48px;border-radius:999px;display:grid;place-items:center;margin-bottom:18px;background:var(--ok-soft);color:var(--ok)}
.failed .mark{background:var(--bad-soft);color:var(--bad)}
.check,.cross{display:none}
main:not(.failed) .check,.failed .cross{display:block}
h1{font-size:19px;line-height:1.3;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
p{margin:0;color:var(--muted)}
.close{margin-top:14px;font-size:13px}
.brand{margin-top:18px;text-align:center;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.stack{width:100%;max-width:400px}
</style>
</head>
<body>
<div class="stack">
<main class="{{STATE}}">
<div class="mark" aria-hidden="true">
<svg class="check" width="24" height="24" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10.5l3.5 3.5 7.5-8"/></svg>
<svg class="cross" width="24" height="24" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg>
</div>
<h1>{{TITLE}}</h1>
<p>{{MESSAGE}}</p>
<p class="close">You can close this tab.</p>
</main>
<div class="brand">{{NAME}}</div>
</div>
</body>
</html>
