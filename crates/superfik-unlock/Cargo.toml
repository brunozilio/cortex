[package]
name = "superfik-unlock"
description = "The system's own unlock (Touch ID, else the login password) behind a seam, for locking the app."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Security_Credentials_UI", "Win32_System_WinRT"] }
windows-future = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext"] }

[lints]
workspace = true
