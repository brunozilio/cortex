name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            ci
            chore
            revert
      - name: Check the open PR for this branch
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          TITLE="$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json title -q '.[0].title')"
          echo "PR title: $TITLE"
          [[ "$TITLE" =~ ^(feat|fix|perf|refactor|docs|test|ci|chore|revert)(\(.+\))?!?:\ .+ ]]
