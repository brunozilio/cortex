[package]
name = "superfik-keychain"
description = "The system's credential store (Keychain, Credential Manager) with values of any size."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native", "sync-secret-service", "crypto-rust", "vendored"] }
tracing.workspace = true
serde_json.workspace = true
superfik-private-file.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = "4"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", features = ["OSX_10_15"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
