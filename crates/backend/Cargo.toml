[package]
name = "backend"
description = "Superfik backend: executes client commands against the agent engine. In-process today; the same seam serves a remote server later."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
private-file.workspace = true
domain.workspace = true
protocol.workspace = true
llm-providers.workspace = true
crossbeam-channel.workspace = true
mlx.workspace = true
agent-engine.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tiny_http = "0.12"
base64 = "0.23"
sha2 = "0.10"
chacha20poly1305 = "0.10"
getrandom = "0.3"
serde.workspace = true
uuid.workspace = true
fastembed = { version = "7", optional = true }

[features]
default = ["embeddings"]
embeddings = ["dep:fastembed"]

[dev-dependencies]
agent-engine = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "rustls-tls-native-roots"] }

[lints]
workspace = true
