[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.7.3"
edition = "2024"
publish = false
authors = ["Bruno Zilio"]
rust-version = "1.97"

[workspace.dependencies]
brand = { path = "crates/brand" }
domain = { path = "crates/domain" }
protocol = { path = "crates/protocol" }
# Semantic memory (`embeddings`) is a feature each user turns on: the static
# Linux build goes without it (ONNX Runtime has no musl build).
backend = { path = "crates/backend", default-features = false }
subprocess = { path = "crates/subprocess" }
private-file = { path = "crates/private-file" }
mlx = { path = "crates/mlx" }
agent-engine = { path = "crates/agent-engine" }
llm-providers = { path = "crates/llm-providers" }
sdk = { path = "crates/sdk" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tempfile = "3"
crossbeam-channel = "0.5"

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
