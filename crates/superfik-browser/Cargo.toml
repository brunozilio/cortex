[package]
name = "superfik-browser"
description = "Browser cards: a Chromium (CEF) page rendered off-screen into a wgpu texture, behind a trait."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
superfik-private-file.workspace = true
superfik-core.workspace = true
wgpu.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
superfik-keychain.workspace = true
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
rusqlite = { version = "0.39", features = ["bundled"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
cef = { version = "154.5", default-features = false, features = ["accelerated_osr", "sandbox"] }
cef-dll-sys = "154.5"

[target.'cfg(target_os = "macos")'.dependencies]
welding = { version = "0.15", features = ["cef-runtime"] }
objc2 = "0.6"
libc = "0.2"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSDate", "NSRunLoop", "NSString", "NSTimer"] }

[target.'cfg(target_os = "linux")'.dependencies]
welding = { version = "0.15", features = ["cef-runtime", "cpu-paint-fallback"] }
dbus-secret-service = "4"

[dev-dependencies]
tempfile.workspace = true
pollster.workspace = true
winit.workspace = true
image.workspace = true

[lints]
workspace = true
