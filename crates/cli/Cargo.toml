[package]
name = "cli"
description = "The terminal chat: talk to the agent in your project."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "superfik"
path = "src/main.rs"

[features]
default = ["embeddings"]
# Semantic memory search; the static (musl) Linux build goes without it.
embeddings = ["sdk/embeddings"]

[dependencies]
brand.workspace = true
sdk = { workspace = true, default-features = false }
domain.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
ratatui = "0.30.2"
unicode-width = "0.2.3"
clap = { version = "4.6.7", features = ["derive"] }
tui-markdown = "0.3.13"
# Already built for tui-markdown's code blocks; the same features.
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "plist-load", "regex-onig"] }
tachyonfx = { version = "0.25.2", default-features = false, features = ["std", "std-duration"] }
tui-big-text = "0.8.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "rustls-tls-native-roots"] }
sha2 = "0.10"
flate2 = "1.1"
tar = "0.4"

[dev-dependencies]
tempfile.workspace = true
backend.workspace = true
agent-engine = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
