[package]
name = "superfik-remote"
description = "The app's Backend over the network: a WebSocket to a team's Superfik server."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
superfik-core.workspace = true
superfik-protocol.workspace = true
crossbeam-channel.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "CloseEvent", "Event", "Window"] }

[dev-dependencies]
superfik-backend.workspace = true
superfik-server.workspace = true
superfik-engine = { workspace = true, features = ["fake"] }
tokio = { version = "1", features = ["rt-multi-thread", "net"] }

[lints]
workspace = true
