[package]
name = "superfik-server"
description = "The Superfik server: one per team, embedded in the desktop for local use or self-hosted, with its own users."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
superfik-private-file.workspace = true
superfik-core.workspace = true
superfik-protocol.workspace = true
superfik-backend.workspace = true
superfik-identity.workspace = true
superfik-browser.workspace = true
superfik-pages.workspace = true
crossbeam-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
base64 = "0.22"
uuid.workspace = true
ureq = { version = "3", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }
axum = { version = "0.8", features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }

[features]
testing = []

[dev-dependencies]
superfik-server = { path = ".", features = ["testing"] }
superfik-engine = { workspace = true, features = ["fake"] }
superfik-channels.workspace = true
http-body-util = "0.1"
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tempfile.workspace = true

[lints]
workspace = true
