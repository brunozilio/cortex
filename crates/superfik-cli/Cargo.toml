[package]
name = "superfik-cli"
description = "The terminal chat: talk to Superfik's agent in your project."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "superfik"
path = "src/main.rs"

[dependencies]
superfik-sdk.workspace = true
superfik-core.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
ratatui = "0.30.2"
unicode-width = "0.2.3"
clap = { version = "4.6.7", features = ["derive"] }

[dev-dependencies]
tempfile.workspace = true
superfik-backend.workspace = true
superfik-engine = { workspace = true, features = ["fake"] }

[lints]
workspace = true
