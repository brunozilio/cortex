name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: oven-sh/setup-bun@v2
      - name: tag matches the workspace version
        shell: bash
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "cli") | .version')
          test "v$version" = "$GITHUB_REF_NAME"
      - name: web page
        run: cargo run -q --locked -p xtask -- web
      - name: release check
        run: cargo run -q --locked -p xtask -- check-release
      - name: build
        run: cargo build --release --locked -p cli --target ${{ matrix.target }}
      - name: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bin=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "cli") | .targets[] | select(.kind[] == "bin") | .name')
          name="$bin-$GITHUB_REF_NAME-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/$bin" README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cd dist
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  draft:
    name: draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.tar.gz.sha256
