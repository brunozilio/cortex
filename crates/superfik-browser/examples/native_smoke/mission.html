<!doctype html><meta charset="utf-8"><title>Agent mission</title>
<h1>Agent mission</h1>
<button id="stable" onclick="window.clicked='stable'">Stable action</button>
<button onclick="window.authWindow=window.open('/oauth','auth-flow');window.opened=!!window.authWindow">Sign in pop-up</button>
<label>Password <input type="password" value="do-not-expose-password"></label>
<input id="upload" type="file" aria-label="Mission upload" multiple>
<button onclick="document.getElementById('hidden-upload').click()">Attach staged report</button>
<input id="hidden-upload" type="file" style="display:none">
<a href="/download">Download report</a>
<button onclick="window.confirmed=confirm('Confirm fixture action?')">Ask confirmation</button>
<div id="shadow"></div>
<iframe title="Cross-origin mission" src="FRAME_URL"></iframe>
<script>
addEventListener('message',e=>{if(e.data==='oauth-success')window.authenticated=true;});
addEventListener('message',e=>{if(e.data==='frame-clicked')window.frameClicked=true;});
document.getElementById('shadow').attachShadow({mode:'closed'}).innerHTML =
  '<button onclick="window.clicked=\'shadow\'">Shadow action</button>';
</script>
