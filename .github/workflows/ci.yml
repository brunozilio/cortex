name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      smoke_only:
        description: Verify the selected macOS runner without building the app
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  runner-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.smoke_only
    runs-on: ${{ fromJSON(vars.SUPERFIK_CI_RUNNER || '["macos-latest"]') }}
    steps:
      - name: Verify the selected Mac and toolchain
        env:
          SELF_HOSTED: ${{ runner.environment == 'self-hosted' }}
        run: |
          if [[ "$SELF_HOSTED" == true ]]; then
            test "$RUNNER_NAME" = superfik-mac-arm64
            test "$(uname -m)" = arm64
            cargo deny --version
          fi
          sw_vers -productVersion
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version
          cmake --version
          ninja --version
  check:
    if: github.event_name != 'workflow_dispatch' || !inputs.smoke_only
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.SUPERFIK_CI_RUNNER || '["macos-latest"]') }}
    env:
      SUPERFIK_ADHOC: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Use this runner's persistent build cache
        if: runner.environment == 'self-hosted'
        run: |
          mkdir -p "$RUNNER_TOOL_CACHE/superfik-target"
          test ! -e target
          ln -s "$RUNNER_TOOL_CACHE/superfik-target" target
      - name: Fetch pinned native engine
        if: vars.SUPERFIK_BROWSER_RELEASE_ENABLED == 'true'
        run: |
          engine_path="$(python3 scripts/fetch_engine.py --output "$RUNNER_TEMP/browser-engine")"
          echo "CEF_PATH=$engine_path" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: runner.environment != 'self-hosted'
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: runner.environment != 'self-hosted'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo run -q -p xtask -- lint
      - uses: taiki-e/install-action@98b24ef8830c90613ec3b57343df3abde2b66e56 # cargo-deny
        if: runner.environment != 'self-hosted'
      - run: cargo deny check
      - run: cargo test --workspace
      - run: python3 -m unittest discover -s scripts -p 'test_cef_*.py'

  windows:
    if: github.event_name != 'workflow_dispatch' || !inputs.smoke_only
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo run -q -p xtask -- lint
      - run: cargo test --workspace --no-fail-fast
      - run: python -m unittest discover -s scripts -p 'test_windows_*.py'

  linux:
    if: github.event_name != 'workflow_dispatch' || !inputs.smoke_only
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev libdbus-1-dev libudev-dev libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev mesa-vulkan-drivers libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libatspi2.0-0t64 libcups2t64 libgbm1 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 libcairo2 xvfb xauth fonts-dejavu-core
      - name: Fetch the pinned Linux engine
        if: hashFiles('scripts/cef-release.linux-x86_64.lock.json') != ''
        run: |
          engine_path="$(python3 scripts/fetch_engine.py --lock scripts/cef-release.linux-x86_64.lock.json --target x86_64-unknown-linux-gnu)"
          echo "CEF_PATH=$engine_path" >> "$GITHUB_ENV"
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo run -q -p xtask -- lint
      - run: cargo test --workspace -j1
      - run: python3 -m unittest discover -s scripts -p 'test_cef_*.py'
      - name: Exercise the real Linux browser
        if: hashFiles('scripts/cef-release.linux-x86_64.lock.json') != ''
        env:
          SUPERFIK_BROWSER_CHECK_LOGS: target/browser-check-logs
        run: xvfb-run -a bash scripts/check-browser-native.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: linux-browser-acceptance
          path: target/browser-check-logs
          if-no-files-found: ignore
          retention-days: 7

  bundle:
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.SUPERFIK_CI_RUNNER || '["macos-latest"]') }}
    needs: check
    env:
      SUPERFIK_ADHOC: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Use this runner's persistent build cache
        if: runner.environment == 'self-hosted'
        run: |
          mkdir -p "$RUNNER_TOOL_CACHE/superfik-target"
          test ! -e target
          ln -s "$RUNNER_TOOL_CACHE/superfik-target" target
      - name: Fetch pinned native engine
        if: vars.SUPERFIK_BROWSER_RELEASE_ENABLED == 'true'
        run: |
          engine_path="$(python3 scripts/fetch_engine.py --output "$RUNNER_TEMP/browser-engine")"
          echo "CEF_PATH=$engine_path" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: runner.environment != 'self-hosted'
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: runner.environment != 'self-hosted'
      - run: brew install cmake ninja
        if: runner.environment != 'self-hosted'
      - run: scripts/bundle-macos.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: runner.environment != 'self-hosted' || vars.SUPERFIK_CI_UPLOAD_ARTIFACTS == 'true'
        with:
          name: Superfik-macos
          path: target/release/bundle/*.dmg
          retention-days: 3
