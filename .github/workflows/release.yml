name: Release

# release-please keeps a release PR open from the conventional commits on
# main. Merging it tags vX.Y.Z and creates the GitHub release; the build
# job then attaches the `superfik` binary for each platform.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and attach binaries to (v0.3.0)
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please bumps the version in Cargo.toml; keep Cargo.lock in step
  # on the release PR so `--locked` builds pass after the merge.
  lockfile:
    needs: release-please
    if: needs.release-please.outputs.pr
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo update --workspace
      - run: |
          git diff --quiet Cargo.lock && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update Cargo.lock"
          git push

  # A PR opened or pushed with GITHUB_TOKEN triggers no workflows, but
  # workflow_dispatch is exempt: run the required checks on the release
  # branch so its PR can merge.
  release-pr-checks:
    needs: [release-please, lockfile]
    if: needs.release-please.outputs.pr
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
    steps:
      - run: |
          gh workflow run ci.yml -R "$GITHUB_REPOSITORY" --ref "$BRANCH"
          gh workflow run pr-title.yml -R "$GITHUB_REPOSITORY" --ref "$BRANCH"

  build:
    needs: release-please
    if: always() && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          # Static builds for any Linux (RHEL 8/9's older glibc), without
          # semantic memory: ONNX Runtime has no musl build.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            flags: --no-default-features
            cargo: zigbuild
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            flags: --no-default-features
            cargo: zigbuild
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        # Usually on the image already: no apt (and its mirrors) unless missing.
        run: dpkg -s pkg-config libssl-dev >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev)
      # zig is the musl C toolchain (ring, oniguruma): from PyPI, not apt.
      - if: matrix.cargo == 'zigbuild'
        run: python3 -m pip install --user --break-system-packages ziglang cargo-zigbuild
      - run: cargo ${{ matrix.cargo || 'build' }} --release --locked -p cli --target ${{ matrix.target }} ${{ matrix.flags }}
      - name: Sign and notarize
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: .github/workflows/scripts/sign-macos.sh "target/${{ matrix.target }}/release/superfik"
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          NAME="superfik-${TAG#v}-${{ matrix.target }}"
          STAGE="$RUNNER_TEMP/$NAME"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/superfik" README.md "$STAGE/"
          tar -C "$RUNNER_TEMP" -czf "$NAME.tar.gz" "$NAME"
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          echo "ASSET=$NAME.tar.gz" >> "$GITHUB_ENV"
      - name: Smoke test
        shell: bash
        run: "target/${{ matrix.target }}/release/superfik --version"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber
