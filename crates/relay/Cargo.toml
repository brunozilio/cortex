[package]
name = "relay"
description = "The remote control's relay: serves the page to phones and pairs each phone's WebSocket with its machine's, forwarding frames it cannot read."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
page.workspace = true
tunnel.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", features = ["ws"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "macros", "time", "signal"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }

[dev-dependencies]
tokio-tungstenite = "0.29"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
