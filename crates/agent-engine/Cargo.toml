[package]
name = "agent-engine"
description = "The native agent engine: the agent loop and its tools, in process; models are reached through llm-providers."
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["subscription-providers"]
subscription-providers = ["llm-providers/subscription-providers"]
test-support = ["llm-providers/test-support", "language-servers/test-support"]

[dependencies]
script.workspace = true
content.workspace = true
brand.workspace = true
domain.workspace = true
platform.workspace = true
language-servers.workspace = true
llm-providers.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize"] }
thiserror.workspace = true
tracing.workspace = true
ignore = "0.4"
globset = "0.4"
regex = "1"
base64 = "0.23"
sha2 = "0.10"
jsonschema = { version = "0.33", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
uuid.workspace = true
flate2 = "1"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
agent-engine = { path = ".", default-features = false, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
