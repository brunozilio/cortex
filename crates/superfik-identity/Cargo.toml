[package]
name = "superfik-identity"
description = "A Superfik server's own users: usernames, first-access codes, passwords, sign-in tokens and roles."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
superfik-private-file.workspace = true
superfik-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["getrandom"] }
getrandom = "0.3"
sha2 = "0.10"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
